<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 600" fill="none">
  <defs>
    <radialGradient id="p5-lolliPink" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffc4dc"/>
      <stop offset="55%" stop-color="#ef6fa3"/>
      <stop offset="100%" stop-color="#c94b82"/>
    </radialGradient>
    <radialGradient id="p5-lolliMint" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#d3fff0"/>
      <stop offset="55%" stop-color="#6fe0bd"/>
      <stop offset="100%" stop-color="#37b491"/>
    </radialGradient>
    <radialGradient id="p5-lolliYellow" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#ffcf5c"/>
      <stop offset="100%" stop-color="#e0a728"/>
    </radialGradient>
    <linearGradient id="p5-wrapViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2c4ff"/>
      <stop offset="100%" stop-color="#b17ce0"/>
    </linearGradient>
    <radialGradient id="p5-gummyOrange" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#ffd7a8"/>
      <stop offset="100%" stop-color="#f0913f"/>
    </radialGradient>
  </defs>

  <!-- Todo a muy baja opacidad a propósito: esta va detrás de burbujas
       de texto en un chat angosto, tiene que ser casi imperceptible,
       una textura, no una ilustración que compita con el mensaje. -->
  <g opacity="0.16">
    <g transform="translate(50,60) rotate(-10)">
      <rect x="-3" y="34" width="6" height="58" rx="3" fill="#8a7460"/>
      <circle cx="0" cy="0" r="38" fill="url(#p5-lolliPink)"/>
    </g>

    <g transform="translate(270,140) scale(0.6)">
      <path d="M35 90 C10 90 0 65 8 45 C-4 40 -2 15 18 12 C22 -2 55 -4 60 10 C82 8 90 34 76 45 C86 62 74 90 50 90 Z" fill="url(#p5-gummyOrange)"/>
    </g>

    <g transform="translate(60,260) rotate(12)">
      <path d="M26 0 L6 13 L0 26 L13 6 Z" fill="url(#p5-wrapViolet)"/>
      <rect x="6" y="11" width="38" height="30" rx="6" fill="url(#p5-wrapViolet)"/>
      <path d="M50 0 L70 13 L76 26 L63 6 Z" fill="url(#p5-wrapViolet)"/>
    </g>

    <g transform="translate(250,320) rotate(-8)">
      <rect x="-3" y="34" width="6" height="58" rx="3" fill="#8a7460"/>
      <circle cx="0" cy="0" r="38" fill="url(#p5-lolliMint)"/>
    </g>

    <g transform="translate(70,420) scale(0.6)">
      <path d="M35 90 C10 90 0 65 8 45 C-4 40 -2 15 18 12 C22 -2 55 -4 60 10 C82 8 90 34 76 45 C86 62 74 90 50 90 Z" fill="url(#p5-gummyOrange)"/>
    </g>

    <g transform="translate(260,500) rotate(9)">
      <rect x="-3" y="30" width="6" height="52" rx="3" fill="#8a7460"/>
      <circle cx="0" cy="0" r="34" fill="url(#p5-lolliYellow)"/>
    </g>

    <circle cx="170" cy="30"  r="4" fill="#ef6fa3"/>
    <circle cx="20"  cy="180" r="4" fill="#6fe0bd"/>
    <circle cx="310" cy="230" r="4" fill="#ffcf5c"/>
    <circle cx="150" cy="360" r="4" fill="#b17ce0"/>
    <circle cx="30"  cy="540" r="4" fill="#ef6fa3"/>
    <circle cx="180" cy="560" r="4" fill="#6fe0bd"/>
  </g>
</svg>
